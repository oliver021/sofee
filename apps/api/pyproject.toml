[project]
name = "sofee-api"
version = "0.1.0"
description = "Sofee backend — FastAPI, auth por sesión, providers LLM y panel admin"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "python-multipart>=0.0.18",
    "httpx>=0.27",
    "deepagents>=0.7,<0.8",
    "langchain-openai>=1.7,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "psycopg[binary,pool]>=3.2",
    "pypdf>=6.21.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
